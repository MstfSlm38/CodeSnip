name: CodeSnip CI

on:
  pull_request:
  push:
    branches: ["26Q2.5"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  build:
    name: Build Windows app
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run dist
