name: Deploy CodeSnip to GitHub Pages

on:
  push:
    branches: ["26Q2.5"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeSnip app
        uses: actions/checkout@v4
        with:
          ref: 26Q3.5
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload CodeSnip app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
